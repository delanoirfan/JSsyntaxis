<!DOCTYPE html>
<html lang="en">
<head>

    <title>JS syntaxis</title>
</head>
<body>
    <h1>Een titel</h1>

    <script>
        /*console.log('Het Werkt!')*/
        let str1 = 'dag'
        let str2 = 'wereld'
        console.log(str1 + ' ' + str2);

        console.log('Er zijn ' + aantal + 'mensen'); 
        console.log('Er zijn ${aantal} mensen aanwezig.')
        
        let i = 1;
        console.log(++i);
        console.log(i++);
        console.log(i);

        i = i + 7
        console.log(i) 
        
    </script>
